# os:e8y6-owned Calamares 3.3 configuration; no Lubuntu job sequence.
---
modules-search: [ local ]
instances:
  - id: kernel
    module: shellprocess
    config: shellprocess-kernel.conf
  - id: installed-session
    module: shellprocess
    config: shellprocess-installed-session.conf
  - id: logs
    module: shellprocess
    config: shellprocess-logs.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - shellprocess@kernel
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess@installed-session
      - shellprocess@logs
      - umount
  - show:
      - finished
branding: os-e8y6
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
